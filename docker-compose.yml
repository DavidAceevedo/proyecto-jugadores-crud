services:
  db:
    image: mariadb:10.11
    container_name: players_mariadb
    restart: always
    environment:
      # Si usas estas variables, asegúrate de que existen en tu archivo .env
      # O cámbialas por valores directos para probar
      - MARIADB_DATABASE=${DB_NAME:-players_db}
      - MARIADB_USER=${DB_USER:-admin}
      - MARIADB_PASSWORD=${DB_PASSWORD:-admin}
      - MARIADB_ROOT_PASSWORD=root  # He puesto 'root' para que coincida con tu código
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: